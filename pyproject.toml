[project]
name = "paysystem"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikita Yuskov",email = "nyuskov@gmail.com"}
]
readme = "README.md"
package-mode = false
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "pydantic-extra-types (>=2.11.1,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "fastapi-users[sqlalchemy] (>=15.0.5,<16.0.0)",
    "sqlalchemy (<2.1.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.fastapi]
entrypoint = "backend.main:app"

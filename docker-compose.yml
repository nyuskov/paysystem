services:
  traefik:
    # v3.6 умеет согласовывать версию Docker API (v3.0 ходит как клиент 1.24,
    # а Docker 29 требует минимум 1.40 — провайдер падал и роутеров не было)
    image: traefik:v3.6
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # TLS по умолчанию (самоподписанный сертификат) — на случай перехода на HTTPS
      - "--entrypoints.websecure.http.tls=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  fastapi-app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: fastapi_app
    volumes:
      - .:/app
    labels:
      - "traefik.enable=true"
      # HTTP (в dev — по любому адресу, включая IP сервера)
      - "traefik.http.routers.fastapi.rule=PathPrefix(`/`)"
      - "traefik.http.routers.fastapi.entrypoints=web"
      # HTTPS с самоподписанным сертификатом Traefik (https://localhost)
      - "traefik.http.routers.fastapi-secure.rule=PathPrefix(`/`)"
      - "traefik.http.routers.fastapi-secure.entrypoints=websecure"
      - "traefik.http.routers.fastapi-secure.tls=true"
      - "traefik.http.routers.fastapi-secure.service=fastapi"
      # Указываем Traefik внутренний порт FastAPI
      - "traefik.http.services.fastapi.loadbalancer.server.port=80"

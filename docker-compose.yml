services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # --- БАЗА ДАННЫХ POSTGRESQL ---
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: secret_payment_pass
      POSTGRES_DB: payment_gate
    volumes:
      # Постоянное хранилище для данных БД, чтобы они не стирались при перезапуске
      - postgres_data:/var/data/postgresql/data
    healthcheck:
      # Проверка готовности БД, чтобы FastAPI не падал при старте
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_gate"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: fastapi_app
    volumes:
      - .:/app
    environment:
      - MYPYPATH=/app/backend
      - PYTHONPATH=/app/backend
      # Передаем URL подключения прямо в переменные окружения бэкенда
      - DATABASE_URL=postgresql+asyncpg://payment_user:secret_payment_pass@db:5432/payment_gate
    depends_on:
      db:
        condition: service_healthy # Ждем полного запуска и успешного хелсчека БД
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fastapi.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.fastapi.entrypoints=web"
      - "traefik.http.routers.fastapi.priority=100"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.fastapi.middlewares=api-strip"
      - "traefik.http.routers.fastapi-secure.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.fastapi-secure.entrypoints=websecure"
      - "traefik.http.routers.fastapi-secure.tls=true"
      - "traefik.http.routers.fastapi-secure.priority=100"
      - "traefik.http.routers.fastapi-secure.middlewares=api-strip"
      - "traefik.http.routers.fastapi-secure.service=fastapi"
      - "traefik.http.services.fastapi.loadbalancer.server.port=80"

  frontend:
    image: node:22-alpine
    container_name: nuxt_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - NUXT_API_PROXY_TARGET=http://backend:80
    command: sh -c "corepack enable && pnpm config set store-dir /pnpm-store && pnpm install --dangerously-allow-all-builds && pnpm dev --host 0.0.0.0 --port 3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend-secure.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.routers.frontend-secure.priority=1"
      - "traefik.http.routers.frontend-secure.service=frontend"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    restart: unless-stopped

volumes:
  frontend_node_modules:
  pnpm_store:
  postgres_data: # Объявляем новый именованный том для хранения данных Postgres
